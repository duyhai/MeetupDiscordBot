name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'yarn'
    - name: Install
      uses: borales/actions-yarn@v4
      with:
        cmd: install
    - name: Lint
      uses: borales/actions-yarn@v4
      with:
        cmd: lint
    - name: Unit tests
      uses: borales/actions-yarn@v4
      with:
        cmd: test

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: 'yarn'
    - name: Install
      uses: borales/actions-yarn@v4
      with:
        cmd: install
    - name: Integration tests
      uses: borales/actions-yarn@v4
      with:
        cmd: test:integration
      env:
        REDISCLOUD_URL: redis://localhost:6379
        DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
